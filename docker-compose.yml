
services:
  backend:
    build:
      context: ./backend
    container_name: imagineai-backend
    ports:
      - "8000:8000"
    environment:
      HF_SPACE_ID: obacodes/text-to-image-inference
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: imagineai-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
